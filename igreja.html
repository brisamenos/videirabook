<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar</title>
<meta name="theme-color" content="#1E3B2C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: 'Newsreader'; src: url('/fonts/newsreader-latin-opsz-normal.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
@font-face { font-family: 'Figtree'; src: url('/fonts/figtree-latin-wght-normal.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
:root { --p: #1E3B2C; --d: #B48A3F; --fundo: #F3F2EE; --papel: #fff; --tinta: #1F241F; --suave: #5F655E; --linha: #D9DCD4; --perigo: #A3352B;
  --serif: 'Newsreader', Georgia, serif; --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #121513; --papel: #1B201C; --tinta: #E6E9E3; --suave: #A6ADA4; --linha: #313A33; --perigo: #E2847A; } }
:root[data-theme="dark"] { --fundo: #121513; --papel: #1B201C; --tinta: #E6E9E3; --suave: #A6ADA4; --linha: #313A33; --perigo: #E2847A; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--fundo); color: var(--tinta); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.tela { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.lado { background: var(--p); color: #fff; padding: clamp(28px, 6vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.lado::after { content: ''; position: absolute; right: -18%; bottom: -30%; width: 70%; aspect-ratio: 1; border-radius: 50%; border: 28px solid var(--d); opacity: .18; pointer-events: none; }
.marca { display: flex; flex-direction: column; gap: 22px; position: relative; z-index: 1; }
.logo { width: 96px; height: 96px; border-radius: 22px; object-fit: contain; background: #fff; padding: 8px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); }
.logo.letra { display: grid; place-items: center; font: 600 2.4rem var(--serif); color: var(--p); background: var(--d); padding: 0; }
h1 { font: 500 clamp(2.1rem, 4.6vw, 3.4rem)/1.05 var(--serif); margin: 0; letter-spacing: -.01em; max-width: 14ch; text-wrap: balance; }
.cidade { margin: .4rem 0 0; opacity: .78; }
.sobre { max-width: 46ch; opacity: .9; margin: 0; position: relative; z-index: 1; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.form-lado { display: grid; place-items: center; padding: clamp(24px, 5vw, 64px) 16px; }
.caixa { width: 100%; max-width: 400px; }
.abas { display: grid; grid-template-columns: 1fr 1fr; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 4px; margin-bottom: 26px; }
.abas button { border: 0; background: none; padding: .7rem; border-radius: 9px; font: 600 .95rem var(--sans); color: var(--suave); cursor: pointer; }
.abas button[aria-selected="true"] { background: var(--p); color: #fff; }
h2 { font: 500 1.75rem/1.2 var(--serif); margin: 0 0 .3rem; }
.dica { color: var(--suave); margin: 0 0 1.4rem; font-size: .95rem; }
label { display: grid; gap: .35rem; margin-bottom: 1rem; font-weight: 600; font-size: .9rem; }
input { font: 400 1rem var(--sans); color: var(--tinta); background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: .8rem .9rem; width: 100%; }
input:focus { outline: 2px solid var(--d); outline-offset: 1px; border-color: transparent; }
input[aria-invalid="true"] { border-color: var(--perigo); }
small { font-weight: 400; color: var(--suave); font-size: .8rem; }
.btn { width: 100%; border: 0; background: var(--p); color: #fff; font: 600 1rem var(--sans); padding: .9rem; border-radius: 10px; cursor: pointer; margin-top: .3rem; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn:focus-visible, .abas button:focus-visible, .link:focus-visible { outline: 2px solid var(--d); outline-offset: 2px; }
.erro { color: var(--perigo); min-height: 1.3em; font-size: .92rem; margin: .4rem 0 0; }
.link { background: none; border: 0; color: var(--p); font: 600 .92rem var(--sans); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--d); } }
.continuar { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 20px; margin-bottom: 22px; }
.continuar p { margin: 0 0 .8rem; }
.hp { position: absolute; left: -9999px; }
.rodape { font-size: .82rem; color: var(--suave); text-align: center; margin-top: 28px; }
.fechado { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 18px; color: var(--suave); }
.nao-achou { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
@media (max-width: 820px) {
  .tela { grid-template-columns: 1fr; }
  .lado { padding: 28px 20px 30px; gap: 18px; }
  .marca { flex-direction: row; align-items: center; gap: 16px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; }
  .logo.letra { font-size: 1.7rem; }
  h1 { font-size: 1.9rem; }
  .sobre { -webkit-line-clamp: 3; font-size: .95rem; }
  .form-lado { place-items: start center; padding-top: 26px; }
}
</style>
</head>
<body>
<div id="raiz"><div class="nao-achou"><p>Carregando…</p></div></div>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
  const raiz = document.getElementById('raiz');
  const api = async (url, body) => {
    const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' });
    let d = null; try { d = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((d && d.erro) || 'Não foi possível concluir. Tente de novo.'); e.dados = d; throw e; }
    return d;
  };
  const entrarNoApp = () => { location.href = '/#/inicio'; };

  async function iniciar() {
    let ig;
    try { ig = await api('/api/publico/igreja/' + encodeURIComponent(slug)); }
    catch { raiz.innerHTML = '<div class="nao-achou"><h2>Igreja não encontrada</h2><p class="dica">Confira o endereço que você recebeu.</p></div>'; return; }
    document.documentElement.style.setProperty('--p', ig.cor_primaria);
    document.documentElement.style.setProperty('--d', ig.cor_destaque);
    document.querySelector('meta[name=theme-color]').content = ig.cor_primaria;
    document.title = ig.nome;
    let eu = null; try { eu = (await api('/api/me')).usuario; } catch {}
    const iniciais = ig.nome.split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁÉ]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    raiz.innerHTML = `<div class="tela">
      <section class="lado">
        <div class="marca">${ig.logo ? `<img class="logo" src="${esc(ig.logo)}" alt="">` : `<span class="logo letra" aria-hidden="true">${esc(iniciais)}</span>`}
          <div><h1>${esc(ig.nome)}</h1>${ig.cidade ? `<p class="cidade">${esc(ig.cidade)}</p>` : ''}</div></div>
        ${ig.sobre ? `<p class="sobre">${esc(ig.sobre)}</p>` : '<p class="sobre">Mural da igreja, informativos, versículo do dia e a Bíblia, num só lugar.</p>'}
      </section>
      <main class="form-lado"><div class="caixa">
        ${eu ? `<div class="continuar"><p>Você já está conectado como <strong>${esc(eu.apelido || eu.nome)}</strong>.</p><button class="btn" type="button" id="continuar">Abrir o app</button>
          <p style="margin:.8rem 0 0"><button class="link" type="button" id="outra">Entrar com outra conta</button></p></div>` : ''}
        <div class="abas" role="tablist">
          <button role="tab" id="t-entrar" aria-controls="p-entrar" aria-selected="${location.hash === '#criar' && ig.inscricoes_abertas ? 'false' : 'true'}">Entrar</button>
          <button role="tab" id="t-criar" aria-controls="p-criar" aria-selected="${location.hash === '#criar' && ig.inscricoes_abertas ? 'true' : 'false'}">Criar conta</button>
        </div>
        <form id="p-entrar" role="tabpanel" aria-labelledby="t-entrar" novalidate>
          <h2>Bem-vindo de volta</h2><p class="dica">Entre com o e-mail e a senha da sua conta.</p>
          <label>E-mail<input name="usuario" type="email" autocomplete="username" required></label>
          <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
          <button class="btn" type="submit">Entrar</button>
          <p class="erro" id="e-entrar" role="alert"></p>
          <p class="dica" style="margin:.6rem 0 0;font-size:.88rem">Esqueceu a senha? Peça à secretaria da igreja para criar uma nova.</p>
        </form>
        <form id="p-criar" role="tabpanel" aria-labelledby="t-criar" novalidate hidden>
          ${ig.inscricoes_abertas ? `<h2>Faça parte</h2><p class="dica">Crie sua conta para acompanhar o mural e os informativos da ${esc(ig.nome)}.</p>
          <label>Nome completo<input name="nome" autocomplete="name" required maxlength="120"></label>
          <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
          <label>WhatsApp <small>com DDD (opcional)</small><input name="telefone" type="tel" inputmode="tel" autocomplete="tel"></label>
          <label>Crie uma senha<input name="senha" type="password" autocomplete="new-password" minlength="6" required><small>Pelo menos 6 caracteres.</small></label>
          <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn" type="submit">Criar minha conta</button>
          <p class="erro" id="e-criar" role="alert"></p>`
          : '<div class="fechado">Os cadastros estão fechados no momento. Fale com a liderança da igreja para receber o seu acesso.</div>'}
        </form>
        <p class="rodape">VideiraBook</p>
      </div></main></div>`;
    const tabs = [['t-entrar', 'p-entrar'], ['t-criar', 'p-criar']];
    const mostrar = id => tabs.forEach(([t, p]) => { const on = t === id; document.getElementById(t).setAttribute('aria-selected', on); document.getElementById(p).hidden = !on; });
    tabs.forEach(([t]) => document.getElementById(t).addEventListener('click', () => mostrar(t)));
    mostrar(location.hash === '#criar' && ig.inscricoes_abertas ? 't-criar' : 't-entrar');
    if (eu) {
      document.getElementById('continuar').addEventListener('click', entrarNoApp);
      document.getElementById('outra').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.reload(); });
    }
    const fE = document.getElementById('p-entrar');
    fE.addEventListener('submit', async e => {
      e.preventDefault(); const b = fE.querySelector('.btn'), er = document.getElementById('e-entrar'); er.textContent = '';
      const f = new FormData(fE);
      if (!f.get('usuario') || !f.get('senha')) { er.textContent = 'Preencha o e-mail e a senha.'; return; }
      b.disabled = true; b.textContent = 'Entrando…';
      try { await api('/api/login', { usuario: f.get('usuario').trim(), senha: f.get('senha') }); entrarNoApp(); }
      catch (x) { er.textContent = x.message; b.disabled = false; b.textContent = 'Entrar'; }
    });
    const fC = document.getElementById('p-criar');
    if (ig.inscricoes_abertas) fC.addEventListener('submit', async e => {
      e.preventDefault(); const b = fC.querySelector('.btn'), er = document.getElementById('e-criar'); er.textContent = '';
      fC.querySelectorAll('input').forEach(i => i.removeAttribute('aria-invalid'));
      const dados = Object.fromEntries(new FormData(fC));
      b.disabled = true; b.textContent = 'Criando…';
      try { await api('/api/publico/igreja/' + encodeURIComponent(ig.slug) + '/cadastro', dados); entrarNoApp(); }
      catch (x) {
        er.textContent = x.message; b.disabled = false; b.textContent = 'Criar minha conta';
        const c = x.dados && x.dados.campo && fC.querySelector(`[name="${x.dados.campo}"]`); if (c) { c.setAttribute('aria-invalid', 'true'); c.focus(); }
        if (x.dados && x.dados.conta) { fE.querySelector('[name=usuario]').value = dados.email; }
      }
    });
  }
  iniciar();
})();
</script>
</body>
</html>
