<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilustrações Bíblicas 3D</title>
<style>
@font-face { font-family: "Newsreader"; src: url("/fonts/newsreader-latin-opsz-normal.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("/fonts/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: palco 3D em tela cheia; seletor de modelos no topo; painel de estações embaixo no celular e à esquerda no tablet/computador. Visual único (noite no deserto), não segue o tema. */
:root {
  --ceu: #1b2430;
  --painel: rgba(20, 28, 26, 0.86);
  --texto: #f3ecdc;
  --suave: #b9b19c;
  --ouro: #d9b45a;
  --linha: rgba(243, 236, 220, 0.16);
  --f-titulo: "Newsreader", Georgia, "Times New Roman", serif;
  --f-texto: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ceu); color: var(--texto); font-family: var(--f-texto); overflow: hidden; }
#palco { position: fixed; inset: 0; }
#palco canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.topo {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, rgba(14, 19, 24, .75), rgba(14, 19, 24, 0));
  pointer-events: none;
}
.topo h1 { font-family: var(--f-titulo); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.topo h1 small { display: block; font-family: var(--f-texto); font-weight: 400; font-size: .78rem; color: var(--suave); letter-spacing: .02em; }
.botoes { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
.btn {
  font: 500 .85rem var(--f-texto); color: var(--texto); background: rgba(20, 28, 26, .7);
  border: 1px solid var(--linha); border-radius: 999px; padding: 8px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn[aria-pressed="true"] { background: var(--ouro); color: #1d1a12; border-color: var(--ouro); }
.btn:focus-visible, .estacao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

.painel {
  position: fixed; z-index: 5; background: var(--painel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--linha);
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  border-radius: 18px; padding: 14px 16px 12px; max-height: 46%; display: flex; flex-direction: column; gap: 10px;
}
.info { overflow-y: auto; min-width: 0; }
.info .ref { font: 600 .74rem var(--f-texto); color: var(--ouro); letter-spacing: .08em; text-transform: uppercase; }
.info h2 { font-family: var(--f-titulo); font-weight: 600; font-size: 1.35rem; margin: 2px 0 4px; text-wrap: balance; }
.info .medida { font-size: .82rem; color: var(--suave); margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.info p.desc { margin: 0; font-size: .93rem; line-height: 1.5; max-width: 62ch; }
.estacoes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.estacao {
  flex: 0 0 auto; font: 500 .8rem var(--f-texto); color: var(--texto); background: transparent;
  border: 1px solid var(--linha); border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap;
}
.estacao[aria-current="true"] { border-color: var(--ouro); color: var(--ouro); }
.dica { font-size: .74rem; color: var(--suave); margin: 0; }

@media (min-width: 900px) {
  .painel { right: auto; width: 360px; top: calc(86px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: none; left: max(16px, env(safe-area-inset-left, 0px)); }
  .estacoes { flex-wrap: wrap; overflow: visible; order: 2; }
  .info { flex: 1; }
}
.modelos { display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; scrollbar-width: none; max-width: 100%; }
.modelos::-webkit-scrollbar { display: none; }
.modelo { flex: 0 0 auto; font: 500 .8rem var(--f-texto); color: var(--suave); background: rgba(20, 28, 26, .55); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.modelo[aria-current="true"] { color: var(--texto); border-color: var(--texto); }
.modelo:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.topo .cab { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 260px; }
@media (min-width: 900px) { .painel { top: calc(124px + env(safe-area-inset-top, 0px)); } }
#carregando { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ceu); font-family: var(--f-titulo); font-size: 1.2rem; color: var(--suave); }
@media (prefers-reduced-motion: reduce) { .btn, .estacao { transition: none; } }
</style>
</head>
<body>

<div id="palco" aria-label="Modelo 3D. Arraste para girar, use dois dedos para aproximar."></div>
<div id="carregando">Montando o modelo…</div>

<header class="topo">
  <div class="cab">
    <nav class="modelos" id="modelos" aria-label="Modelos"></nav>
    <h1 id="titulo">Ilustrações bíblicas</h1>
  </div>
  <div class="botoes">
    <button class="btn" id="b-passeio" aria-pressed="false">Passeio guiado</button>
    <button class="btn" id="b-extra" aria-pressed="false" hidden>Abrir</button>
    <button class="btn" id="b-fechar" hidden>Fechar</button>
  </div>
</header>

<section class="painel" aria-live="polite">
  <div class="info" id="info"></div>
  <nav class="estacoes" id="estacoes" aria-label="Partes do modelo"></nav>
  <p class="dica">Arraste para girar · pinça ou roda para aproximar · toque numa parte para ir até ela</p>
</section>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
  // dentro do VideiraBook (janela por cima do leitor): botão Fechar avisa o app
  if (window.parent !== window) {
    const b = document.getElementById('b-fechar'); b.hidden = false;
    b.addEventListener('click', () => window.parent.postMessage({ tipo: 'fechar-3d' }, location.origin));
  }
</script>
<script src="base.js"></script>
<script src="tabernaculo.js"></script>
<script src="noe.js"></script>
<script src="templo.js"></script>
<script src="jerusalem.js"></script>
<script src="vestes.js"></script>
<script src="museu.js"></script>
<script src="tunel.js"></script>
<script src="cafarnaum.js"></script>
<script src="portao.js"></script>
<script src="sepulcro.js"></script>
<script src="zigurate.js"></script>
<script src="vinha.js"></script>
</body>
</html>
